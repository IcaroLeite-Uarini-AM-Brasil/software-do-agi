[package]
name = "software-do-agi-ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
